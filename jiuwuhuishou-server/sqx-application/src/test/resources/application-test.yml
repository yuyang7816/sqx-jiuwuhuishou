spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:recycle_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-test.sql
      data-locations: classpath:sql/data-test.sql

redisson:
  host: 127.0.0.1
  port: 6379
  password:
  database: 15
  idleConnectionTimeout: 10000
  connectTimeout: 10000
  timeout: 3000
  retryAttempts: 3
  retryInterval: 1500
  subscriptionsPerConnection: 5
  subscriptionConnectionMinimumIdleSize: 1
  subscriptionConnectionPoolSize: 50
  connectionMinimumIdleSize: 8
  connectionPoolSize: 32
  dnsMonitoringInterval: 5000
  threads: 16
  nettyThreads: 32

management:
  health:
    redis:
      enabled: false

sqx:
  redis:
    open: false
  shiro:
    redis: false
  verify-code:
    test-mode: true
    test-code: "888888"

logging:
  level:
    com.sqx: warn
    org.springframework: warn
